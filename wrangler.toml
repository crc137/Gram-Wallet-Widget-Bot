name = "gram-wallet-widget-bot"
main = "worker.js"
compatibility_date = "2026-11-07"

[observability]
enabled = true

[observability.traces]
enabled = true

[[kv_namespaces]]
binding = "KV"
id = "dd570280157c4036a9c4d3df807f4025"

[previews.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[previews.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[previews.observability.issue_detection]
enabled = false

[triggers]
crons = ["*/10 * * * *"]
